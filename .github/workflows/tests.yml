name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check media tools
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            echo "FFmpeg is unavailable; its integration test will be skipped."
          fi

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare TurboWarp player sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("dist/vtsb3_player_sources.zip")
          required = (
              "video_to_sb3/player.py",
              "extensions/vtsb3player.js",
              "tools/build_player.py",
              "tools/serve_player.py",
              "tools/verify_vtsb3_decoder.cjs",
              "tests/test_player_builder.py",
              "tests/test_player_js_decoder.py",
          )
          with ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("Player source archive is missing: " + ", ".join(missing))
              for name in required:
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(name))
          PY

      - name: Compile Python modules
        run: python -m compileall -q video_to_sb3 tools tests

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
