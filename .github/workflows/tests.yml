name: Python and player tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check media tools
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            echo "FFmpeg is unavailable; media integration tests will be skipped."
          fi

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q video_to_sb3 tools tests

      - name: Build and validate SB3
        run: python tools/build_player.py

      - name: Check JavaScript syntax
        run: |
          node --check extensions/vtsb3_decoder.js
          node --check extensions/vtsb3player.js

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript decoder tests
        run: node tests/test_player_js_decoder.cjs

      - name: Upload player artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtsb3-player
          path: |
            dist/vtsb3_player.sb3
